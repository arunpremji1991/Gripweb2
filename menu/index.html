<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu | GRIP Smashburger</title>
  <meta name="description" content="The full GRIP Smashburger menu in Salalah, Oman: beef smash burgers, crispy chicken burgers, loaded fries, shakes and drinks, with photos, ingredients and prices in OMR. Order online." />
  <meta name="theme-color" content="#F04E24" />
  <link rel="icon" type="image/png" href="/brand/badge-grip-round.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="GRIP" />
  <meta property="og:title" content="GRIP Smashburger Menu" />
  <meta property="og:description" content="Smash burgers, crispy chicken, loaded fries, shakes and more. Salalah, Oman." />
  <meta property="og:image" content="/img/menu/old-school.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <script type="module" crossorigin src="/assets/menu-bEXPrtvw.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/pages-DPaBFKMP.js">
  <link rel="stylesheet" crossorigin href="/assets/pages-Dv9O_Uvm.css">
</head>
<body class="page-menu">
  <div id="site-header"></div>

  <main id="main">
    <section class="page-hero">
      <div class="pg-grid" aria-hidden="true"></div>
      <div class="hero-giant logo-mask" aria-hidden="true"></div>
      <div class="wrap page-hero-inner">
        <div class="page-hero-copy">
          <p class="kicker" data-i18n="page.menu.k">The menu</p>
          <h1 class="page-title"><span class="line"><span data-i18n="page.menu.t">Every smash. Every side.</span></span></h1>
          <p class="page-sub" data-i18n="page.menu.sub"></p>
          <div class="hero-cta"><a class="btn btn-cream js-order" target="_blank" rel="noopener" data-i18n="cta.order">Order now</a></div>
        </div>
        <img class="page-hero-chef wob" src="/brand/character-chef-burger-box.png" alt="" width="735" height="745" fetchpriority="high" />
      </div>
    </section>

    <div class="menu-zone">
    <nav class="cat-nav" id="catNav" aria-label="Menu categories" data-i18n-aria="page.menu.catNav"><div class="cat-nav-inner" id="catNavInner"></div></nav>

    <div class="wrap menu-page" id="menuPage"></div>
    </div>

    <section class="order" id="order">
      <div class="hero-grid" aria-hidden="true"></div>
      <div class="wrap order-inner">
        <div class="order-visual" data-reveal>
          <img class="order-art" src="/brand/illustration-burger-hands.png" alt="" width="582" height="543" loading="lazy" />
          <img class="order-chef wob" src="/brand/character-chef-curled-sticker.png" alt="" width="1109" height="937" loading="lazy" />
        </div>
        <div data-reveal>
          <h2 class="order-h" data-i18n="order.title">Hungry? Get your smash.</h2>
          <p class="order-sub" data-i18n="order.sub"></p>
          <a class="btn btn-cream btn-lg js-order" target="_blank" rel="noopener" data-i18n="cta.order">Order now</a>
        </div>
      </div>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee-track"></div></div>
  </main>

  <dialog class="pdialog" id="itemDialog" aria-labelledby="dlgName">
    <div class="pdialog-panel">
      <button class="pdialog-close" type="button" id="dlgClose" aria-label="Close">×</button>
      <div class="pdialog-img"><img id="dlgImg" alt="" width="600" height="600" /></div>
      <div class="pdialog-info">
        <p class="kicker kicker-o" id="dlgCat"></p>
        <h2 class="pdialog-name" id="dlgName"></h2>
        <p class="pdialog-price" id="dlgPrice"></p>
        <h3 class="pdialog-h" id="dlgIngH" data-i18n="page.menu.ing">Ingredients</h3>
        <ul class="chips" id="dlgIng"></ul>
        <a class="btn js-order" id="dlgOrder" target="_blank" rel="noopener" data-i18n="page.menu.order">Order this online</a>
      </div>
    </div>
  </dialog>

  <div id="site-footer"></div>
</body>
</html>
